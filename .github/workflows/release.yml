name: Release

# Packages the mission itself, not the whole repo, once per supported
# terrain, as both a .zip (for manually unpacking into a missions folder)
# and a real .pbo (for dropping straight into MPMissions on a dedicated
# server). The mission is terrain-agnostic at RUNTIME (the arena, loot, and
# the pre-arena holding spot are all picked dynamically, see
# Waldo_fnc_selectArena and Waldo_fnc_selectHoldingPos), but mission.sqm's
# 128 placed player-start positions are raw world coordinates baked in when
# the mission was saved in Eden, and those are only ever real for the one
# terrain it was authored on (Altis). Shipping them unmodified for a
# differently-shaped terrain risks landing outside the map entirely, not
# just in water.
#
# Naming is Arma's own "MissionName.TerrainName" convention, and it's a hard
# rule, not a style choice: the part before the terrain name must not
# contain ANY dots, or the game fails to parse the folder/pbo name and the
# mission won't show up at all. A version like 2.6.0 breaks that outright if
# used verbatim, so dots in the version are replaced with dashes for the
# packaged name (2.6.0 -> 2-6-0); the git tag itself is untouched.
#
# For each terrain this resolves player-start positions in priority order:
#   1. terrains/<Terrain>/mission.sqm, if present - a real, in-editor
#      verified mission.sqm for that terrain. This is the eventual, correct
#      source once one exists; drop a file there and the workflow prefers
#      it automatically, no workflow change needed.
#   2. Otherwise, .github/terrains.json's entry for that terrain - an
#      interim best-effort anchor (a researched, named, spacious landmark
#      guaranteed to be in-bounds and dry, e.g. an airfield apron) that
#      .github/scripts/patch_mission_positions.py recenters the existing
#      128-position grid onto, preserving its layout. The height is set
#      well above plausible ground so an imprecise anchor still drops
#      players safely onto real terrain (Waldo_fnc_initClient disables
#      damage before anything else runs, so a short fall is cosmetic).
#   3. Otherwise (Altis) - mission.sqm ships exactly as authored.
#
# A tag push (or a manual run against an existing tag) stages the mission
# once, explicitly excluding .git, .github, terrains/, and the wiki/ source
# folder, then builds each terrain's folder from that staged copy and packs
# it into both a .zip and a .pbo (.github/scripts/make_pbo.py - a small,
# self-verifying implementation of the documented PBO format, since no
# actively maintained prebuilt Linux packer exists to depend on instead).

on:
  # Every tag, not just "v*": this repo's own tag history already mixes v2.6.0,
  # V2.5.0, and 2.7.0-RC with no consistent prefix, and a tag that doesn't match
  # the trigger silently builds nothing - the GitHub release UI happily accepts
  # (and even suggests) a tag like "2.7.0-RC" with no "v", so restricting to a
  # prefix is a footgun for a one-person release process, not a safety net.
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach mission zips to"
        required: true

permissions:
  contents: write

env:
  # Terrains this mission is packaged for. Tanoa needs Apex and Enoch needs
  # Contact on the host's end; the mission itself doesn't care which one is
  # loaded. Add a name here (and, ideally, a terrains/<Terrain>/mission.sqm or
  # a .github/terrains.json entry) to ship another terrain. Note: "Enoch" is
  # Livonia's actual internal terrain classname (its CDLC's marketing name,
  # not the classname Arma's own "MissionName.TerrainName" folder convention
  # needs) - Malden's classname matches its marketing name, no such gap there.
  TERRAINS: "Altis Tanoa Stratis Enoch Malden"

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve tag and a filename-safe version
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          VERSION_SAFE="${VERSION//./-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_safe=$VERSION_SAFE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Stage the mission once
        run: |
          mkdir -p stage/_mission dist
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="wiki" \
            --exclude="terrains" \
            --exclude="stage" \
            --exclude="dist" \
            ./ stage/_mission/

      - name: Build one folder, zip, and pbo per terrain
        run: |
          VERSION_SAFE="${{ steps.tag.outputs.version_safe }}"
          cd stage
          for TERRAIN in ${{ env.TERRAINS }}; do
            NAME="TroubleInArmaville_${VERSION_SAFE}.${TERRAIN}"
            rm -rf "$NAME"
            cp -r _mission "$NAME"

            OVERRIDE="../terrains/${TERRAIN}/mission.sqm"
            ANCHOR=$(python3 ../.github/scripts/terrain_anchor.py "$TERRAIN" ../.github/terrains.json)

            if [ -f "$OVERRIDE" ]; then
              echo "$TERRAIN: using the supplied, in-editor-verified mission.sqm"
              cp "$OVERRIDE" "$NAME/mission.sqm"
            elif [ -n "$ANCHOR" ]; then
              echo "$TERRAIN: recentring player positions onto researched anchor ($ANCHOR)"
              python3 ../.github/scripts/patch_mission_positions.py "$NAME/mission.sqm" $ANCHOR
            else
              echo "$TERRAIN: shipping mission.sqm as authored (only known-correct for Altis)"
            fi

            zip -rq "../dist/${NAME}.zip" "$NAME"
            python3 ../.github/scripts/make_pbo.py "$NAME" "../dist/${NAME}.pbo"
            rm -rf "$NAME"
          done

      - name: Create or update the release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Trouble In Armaville $TAG" \
              --generate-notes
          fi
