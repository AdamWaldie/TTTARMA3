name: Sync wiki

# Keeps the GitHub wiki in lockstep with wiki/*.md in this repo. Edit the
# markdown here, merge to main, and the wiki updates itself - no manual
# copy/paste into the wiki UI as features change.
#
# Requires a repo secret WIKI_SYNC_TOKEN: a classic PAT (scope: repo) on an
# account with push access to this repository. The default GITHUB_TOKEN
# cannot push to a wiki, GitHub does not grant that permission to it.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mission repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.WIKI_SYNC_TOKEN }}

      - name: Mirror wiki/*.md onto the wiki repo
        run: |
          rsync -a --delete --exclude=".git" repo/wiki/ wiki-repo/

      - name: Commit and push if anything changed
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${{ github.repository }}@${{ github.sha }}"
          git push
